  <!-- Open Graph / Social Media Preview Meta Tags (Messenger, Facebook, Twitter, WhatsApp, Discord) -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="iConnect Publication" />
  <meta property="og:title" id="og-title" content="Publication Announcement | iConnect" />

  <meta property="og:image" id="og-image" content="/assets/logo/iconnect-share-thumbnail.jpg" />
  <meta property="og:image:secure_url" id="og-image-secure" content="/assets/logo/iconnect-share-thumbnail.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" id="og-url" content="" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:description" id="twitter-desc" content="Official campus announcement and bulletin item from the BSCS Department." />
  <meta name="twitter:image" id="twitter-image" content="/assets/logo/iconnect-share-thumbnail.jpg" />

  <!-- Pre-load Announcements Data & Dynamic Head Meta Updater -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        var custom = JSON.parse(localStorage.getItem('iconnect_announcements_items')) || [];
        var base = (typeof announcementsData !== 'undefined') ? announcementsData : [];
        var merged = custom.length > 0 ? custom : base;
        var ann = merged.find(function(a) { return String(a.id) === String(id); }) || merged[0];
        
        if (ann) {
          document.title = ann.title + ' | iConnect Announcement';
          var origin = window.location.origin;
          var path = window.location.pathname.replace(/[^\/]*$/, '');
          var img = ann.shareThumbnail || ann.image || '/assets/logo/iconnect-share-thumbnail.jpg';
          var fullImgUrl = img.indexOf('://') !== -1 ? img : (origin + path + img.replace(/^\.\//, ''));
          var excerpt = (ann.body || '').replace(/<[^>]*>/g, '').slice(0, 160) + '...';

          var setMeta = function (id, val) {
            var el = document.getElementById(id);
            if (el) el.setAttribute('content', val);
          };
          setMeta('og-title', ann.title + ' | iConnect Announcement');
          setMeta('og-desc', excerpt);
          setMeta('og-image', fullImgUrl);
          setMeta('og-image-secure', fullImgUrl);
          setMeta('og-url', window.location.href);
          setMeta('twitter-title', ann.title + ' | iConnect Announcement');
          setMeta('twitter-desc', excerpt);
          setMeta('twitter-image', fullImgUrl);
        }
      } catch (e) {}
    })();
  </script>
